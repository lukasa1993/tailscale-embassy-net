[package]
name = "tailscale-embassy-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "embassy-net transports for tailscale-embassy-core"
repository = "https://github.com/lukasa1993/tailscale-embassy-net"
publish = false

[features]
default = []
defmt = ["dep:defmt"]
host-tests = ["embassy-time/generic-queue-8", "embassy-time/std"]

[dependencies]
defmt = { version = "=1.0.1", optional = true }
embassy-futures = { version = "=0.1.2", default-features = false }
embassy-net = { version = "=0.9.1", default-features = false, features = ["dns", "medium-ethernet", "medium-ip", "proto-ipv4", "tcp", "udp"] }
embassy-net-driver-channel = { version = "=0.4.0", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
embedded-io-async = { version = "=0.7.0", default-features = false }
embedded-tls = { git = "https://github.com/lukasa1993/tls-transport", rev = "8825987284bf72ebf078d97db0e480945ae2e5fe", version = "=0.19.0", default-features = false }
heapless = { version = "=0.9.3", default-features = false }
picoserve = { version = "=0.18.0", default-features = false, features = ["embassy"] }
rand_core = { version = "=0.6.4", default-features = false }
tailscale-embassy-core = { git = "https://github.com/lukasa1993/tailscale-embassy-core", rev = "0d39eeb6578360de864e0e1c4358005bb70f73ac" }
tls-transport = { git = "https://github.com/lukasa1993/tls-transport", rev = "8825987284bf72ebf078d97db0e480945ae2e5fe" }

[dev-dependencies]
critical-section = { version = "=1.2.0", features = ["std"] }
pollster = "=0.4.0"

[lints.rust]
unsafe_code = "forbid"
