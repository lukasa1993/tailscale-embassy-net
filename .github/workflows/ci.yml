name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.93.0, 1.95.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --target thumbv7em-none-eabihf
      - name: Format
        if: matrix.toolchain == '1.95.0'
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --all-targets
      - name: Check no_std target
        run: cargo +${{ matrix.toolchain }} check --target thumbv7em-none-eabihf --no-default-features
